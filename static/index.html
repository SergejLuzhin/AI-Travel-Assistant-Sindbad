<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сгенерировать тур</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand p-0" href="#">
          <img src="/static/images/SINDBAD.png" alt="Logo" width="120" />
        </a>
      </div>
    </nav>

    <div class="container my-5">
      <!-- Форма -->
      <form id="tourForm">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <!-- Город -->
            <div class="mb-4 col-md-8 mx-auto">
              <label for="cityInput" class="form-label">Город путешествия</label>
              <input
                type="text"
                class="form-control"
                id="cityInput"
                placeholder="Например: Минск"
                required
              />
              <div class="invalid-feedback">Пожалуйста, укажите город</div>
            </div>

            <!-- Бюджет -->
            <div class="mb-4 col-md-8 mx-auto">
              <label for="budgetInput" class="form-label">Бюджет</label>
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="budgetInput"
                  placeholder="В рублях"
                  required
                />
                <span class="input-group-text">₽</span>
              </div>
              <div class="invalid-feedback">Пожалуйста, укажите ваш бюджет</div>
            </div>

            <!-- Даты -->
            <div class="mb-4 col-md-8 mx-auto">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="startDate" class="form-label">Дата начала</label>
                  <input type="date" class="form-control" id="startDate" required />
                  <div class="invalid-feedback">
                    Пожалуйста, укажите дату начала
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="endDate" class="form-label">Дата окончания</label>
                  <input type="date" class="form-control" id="endDate" required />
                  <div class="invalid-feedback">
                    Пожалуйста, укажите дату окончания
                  </div>
                </div>
              </div>
            </div>

            <!-- Количество туристов -->
            <div class="mb-4 col-md-8 mx-auto">
              <label for="peopleCount" class="form-label">Количество туристов</label>
              <input
                type="number"
                class="form-control"
                id="peopleCount"
                min="1"
                required
              />
              <div class="invalid-feedback">
                Пожалуйста, укажите количество туристов
              </div>
            </div>

            <!-- Виды деятельности -->
            <div class="mb-4" style="max-width: 540px; margin: 0 auto">
              <label class="form-label d-block mb-3">
                Какие виды деятельности вас интересуют?
              </label>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityBeach" name="activities" />
                    <label class="form-check-label" for="activityBeach">Пляжи</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activitySightseeing" name="activities" />
                    <label class="form-check-label" for="activitySightseeing">Осмотр достопримечательностей</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityFestivals" name="activities" />
                    <label class="form-check-label" for="activityFestivals">Фестивали/мероприятия</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityFood" name="activities" />
                    <label class="form-check-label" for="activityFood">Гастрономический тур</label>
                  </div>
                </div>

                <div class="col-md-6">
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityShopping" name="activities" />
                    <label class="form-check-label" for="activityShopping">Покупки</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activitySpa" name="activities" />
                    <label class="form-check-label" for="activitySpa">Спа</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityAdventure" name="activities" />
                    <label class="form-check-label" for="activityAdventure">Приключения</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" id="activityNightlife" name="activities" />
                    <label class="form-check-label" for="activityNightlife">Ночная жизнь</label>
                  </div>
                </div>
              </div>
            </div>

            <!-- Кнопка -->
            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary px-5">
                Сгенерировать тур
              </button>
            </div>
          </div>
        </div>
      </form>

      <!-- Блок для вывода результата -->
      <div id="description" class="col-md-8 mx-auto mt-4"></div>
    </div>

    <!-- Подключаем JS -->
    <script src="/static/script.js"></script>
  </body>
</html>
